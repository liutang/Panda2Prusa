services:
  panda2prusa:
    image: ghcr.io/liutang/panda2prusa:latest
    build: .  # used only if the image can't be pulled
    container_name: panda2prusa
    ports:
      - "8543:8543"
    environment:
      # Largest .3mf accepted, in MB.
      P2P_MAX_UPLOAD_MB: "300"
      # Conversions allowed at once; a large painted model can need a few GB each.
      P2P_MAX_CONCURRENT: "1"
    tmpfs:
      # RAM-backed scratch space for uploads and converted files; counts toward
      # the container's memory.
      - /tmp:size=300m
    read_only: true
    restart: unless-stopped
